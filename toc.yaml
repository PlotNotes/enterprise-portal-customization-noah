# ChartSmith Enterprise Portal - Table of Contents
#
# This file defines the navigation structure, page ordering, and visibility
# rules for the ChartSmith Enterprise Portal documentation.

navigation:
  - title: Getting Started
    icon: rocket
    page: pages/getting-started.md
  - title: Conditional Render Test
    page: pages/conditional-render-test.md
    visible_when:
      entitlements:
        - allow_add_cats
  - title: Installation
    icon: download
    items:
      - title: Requirements
        page: pages/installation/requirements.md
      - title: Helm Reference
        helm_chart:
          name: "dnd-plotnotes"
      - title: Linux Installation
        page: pages/installation/linux.md
        visible_when:
          entitlements:
            - isEmbeddedClusterDownloadEnabled
      - title: Helm Installation
        page: pages/installation/helm.md
        visible_when:
          entitlements:
            - isHelmInstallEnabled
      - title: Air Gap Installation
        page: pages/installation/airgap.md
        visible_when:
          entitlements:
            - isAirgapSupported
      - title: Post-Installation
        page: pages/installation/post-installation.md

  - title: Cloud Providers
    icon: cloud
    items:
      - title: AWS
        page: pages/cloud-providers/aws.md
        visible_when:
          entitlements:
            - isAWSEnabled

  - title: Infrastructure
    icon: cloud
    items:
      - title: Overview
        page: pages/infrastructure/overview.md
      - title: AWS
        terraform_module: aws-infrastructure
        visible_when:
          entitlements:
            - isAWSEnabled
      - title: Google Cloud
        terraform_module: gcp-infrastructure
        visible_when:
          entitlements:
            - isGCPEnabled
      - title: Azure
        terraform_module: azure-infrastructure
        visible_when:
          entitlements:
            - isAzureEnabled

  - title: Configuration
    icon: settings
    items:
      - title: Configuration Guide
        page: pages/configuration/configuration.md
      - title: Private Registry
        page: pages/configuration/private-registry.md

  - title: Operators
    icon: wrench
    items:
      - title: Troubleshooting
        page: pages/operators/troubleshooting.md

  - title: Operations
    icon: wrench
    items:
      - title: Monitoring & Metrics
        page: pages/operations/monitoring.md
      - title: Backup & Restore
        page: pages/operations/backup.md
      - title: Upgrading
        page: pages/operations/upgrading.md

  - title: Updates
    icon: refresh-cw
    items:
      - title: Instances & Updates
        page: pages/updates/instances.md

  - title: Reference
    icon: file-text
    items:
      - title: Helm Values
        generated: helm-values
      - title: CLI Reference
        page: pages/reference/cli.md
      - title: API Reference
        page: pages/reference/api.md

  - title: Support
    icon: life-buoy
    items:
      - title: FAQ
        page: pages/support/faq.md
      - title: Contact Support
        page: pages/support/contact.md

overrides:
  home: pages/getting-started.md

hide_defaults:
  - features/branding
  - features/webhooks
